<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DevConnect</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>
        <h1>DevConnect</h1>
        <button id="themeToggle">Toggle Theme</button>
    </header>

    <section class="search-section">
        <h2>Search by Skill</h2>
        <input type="text" id="skillSearch" placeholder="Enter skill to search">
    </section>


    <section class="profile-form">
        <h2>Create Profile</h2>
        <input type="text" id="name" placeholder="Your Name">
        <input type="text" id="bio" placeholder="Short Bio">
        <input type="text" id="skills" placeholder="Skills (comma separated)">
        <input type="text" id="github" placeholder="GitHub Username">
        <button id="createProfile">Create Profile</button>
    </section>

    <section class="profile-display">
        <h2>Your Profile</h2>
        <div id="profileCard"></div>
    </section>

    <section class="github-repos">
        <h2>GitHub Repositories</h2>
        <div id="repos"></div>
    </section>

    <script src="/js/app.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/theme.js"></script>

</body>

</html>
